name: PriceTrack
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
targets:
  PriceTrack:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PriceTrack
        excludes:
          - "App/Info.plist"
      - path: Shared
    info:
      path: PriceTrack/App/Info.plist
      properties:
        NSCameraUsageDescription: "PriceTrack uses your camera to scan grocery receipts so it can read the items and prices."
        NSPhotoLibraryUsageDescription: "PriceTrack can import a photo of a receipt from your library to read its items and prices."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Lets PriceTrack appear under "Open In" for images/PDFs from Files and Mail attachments
        # — works with zero extra entitlements, unlike the Share Extension below (which needs an
        # App Group). LSHandlerRank Alternate, not Owner: PriceTrack offers itself as an option,
        # it doesn't try to become the system default for every image/PDF.
        CFBundleDocumentTypes:
          - CFBundleTypeName: "Receipt Image"
            LSItemContentTypes: ["public.image"]
            LSHandlerRank: Alternate
          - CFBundleTypeName: "Receipt PDF"
            LSItemContentTypes: ["com.adobe.pdf"]
            LSHandlerRank: Alternate
        # We just read the file once (extract data) and never write back to it, so iOS should
        # copy it into our sandbox rather than hand us an in-place-editing bookmark.
        LSSupportsOpeningDocumentsInPlace: false
    # App Group + keychain-sharing entitlements, added to support the Share Extension (see the
    # ShareExtension target below) so a receipt shared from Photos/Files/Mail can be processed
    # the same way as an in-app scan. NOTE: the iCloud/CloudKit capability above is still off
    # because a free "Personal Team" account couldn't provision it — App Groups are a different,
    # generally less-restricted capability, but if Xcode shows a similar signing error here, the
    # rollback is: delete this `entitlements:` block, the whole `ShareExtension` target below,
    # and the `dependencies:` line under this target.
    entitlements:
      path: PriceTrack/App/PriceTrack.entitlements
      properties:
        com.apple.security.application-groups:
          - "group.com.akshay.pricetrack"
        keychain-access-groups:
          - "$(AppIdentifierPrefix)com.akshay.pricetrack.shared"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akshay.pricetrack
        PRODUCT_NAME: PriceTrack
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: ShareExtension
        embed: true
    scheme:
      gatherCoverageData: false

  ShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ShareExtension
        excludes:
          - "Info.plist"
      - path: PriceTrack/Models
      - path: PriceTrack/Services/ClaudeReceiptParser.swift
      - path: PriceTrack/Services/CategoryClassifier.swift
      - path: PriceTrack/Services/PriceNormalizer.swift
      - path: PriceTrack/Services/KeychainStore.swift
      - path: PriceTrack/Features/Scan/TextRecognizer.swift
      - path: PriceTrack/Features/Scan/SmartReceiptReviewView.swift
      - path: PriceTrack/Features/Scan/ReceiptReviewView.swift
      - path: PriceTrack/Features/Scan/AssignLineSheet.swift
      - path: PriceTrack/Features/Shared/ItemPicker.swift
      - path: PriceTrack/DesignSystem
      - path: PriceTrack/Extensions
      - path: Shared
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Add to PriceTrack
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
              NSExtensionActivationSupportsFileWithMaxCount: 1
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - "group.com.akshay.pricetrack"
        keychain-access-groups:
          - "$(AppIdentifierPrefix)com.akshay.pricetrack.shared"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akshay.pricetrack.ShareExtension
        PRODUCT_NAME: ShareExtension
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CODE_SIGN_STYLE: Automatic
